name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Um PR novo (ou push novo) cancela a execução anterior da mesma branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest   # já vem com Docker: o Testcontainers funciona sem configurar nada
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # O mvnw pode ter sido commitado do Windows sem permissão de execução.
      - name: Dar permissão de execução ao mvnw
        run: chmod +x ./mvnw

      - name: Compilar e rodar os testes (Testcontainers sobe o PostgreSQL)
        run: ./mvnw -B verify

      # Se algo falhar, os relatórios do Surefire ficam disponíveis para baixar na aba da execução.
      - name: Guardar relatórios dos testes (só em falha)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: relatorios-dos-testes
          path: target/surefire-reports/
          if-no-files-found: ignore
