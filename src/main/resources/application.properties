spring.application.name=farmacia-online
spring.datasource.url=jdbc:postgresql://localhost:5433/farmacia
spring.datasource.username=farmacia
spring.datasource.password=farmacia

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.show-sql=false
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# As telas leem coleções LAZY (apresentações, imagens) durante a renderização: ver README, "Home e menu de categorias".
spring.jpa.open-in-view=true

# A página só é enviada ao navegador depois de pronta; senão o token CSRF do /login não consegue criar a sessão (ver README).
spring.thymeleaf.servlet.produce-partial-output-while-processing=false
