<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::#pagina})}">
<head>
    <title>Farma++ | A drogaria digital que melhor te atende</title>
</head>
<body>
<div id="pagina">


    <section class="banner" aria-labelledby="titulo-banner">
        <h1 id="titulo-banner">Cuidado que você merece</h1>
        <p>Medicamentos, bem-estar e saúde com entrega rápida.</p>
    </section>

    <section class="beneficios" aria-label="Nossos diferenciais">
        <div class="beneficio">Entrega rápida</div>
        <div class="beneficio">Aqui você encontra os melhores preços</div>
        <div class="beneficio">Descontos e benefícios em medicamentos</div>
        <div class="beneficio">Tudo o que você precisa em um só lugar</div>
    </section>

    <section class="secao" aria-labelledby="titulo-mais-comprados">
        <h2 id="titulo-mais-comprados">Mais comprados</h2>
        <div class="grade">
            <th:block th:each="produto : ${maisComprados}">
                <article th:replace="~{fragments/produto-card :: card(${produto})}"></article>
            </th:block>
        </div>
    </section>

    <section class="secao" aria-labelledby="titulo-mais-vistos">
        <h2 id="titulo-mais-vistos">Mais vistos</h2>
        <div class="grade">
            <th:block th:each="produto : ${maisVistos}">
                <article th:replace="~{fragments/produto-card :: card(${produto})}"></article>
            </th:block>
        </div>
    </section>

    <section class="secao" aria-labelledby="titulo-categorias">
        <h2 id="titulo-categorias">Outras categorias</h2>
        <ul class="categorias">
            <li th:each="item : ${menuCategorias}">
                <a class="categoria" th:href="@{/produtos(categoria=${item.categoria.id})}"
                   th:text="${item.categoria.nome}">Categoria</a>
            </li>
        </ul>
    </section>


</div>
</body>
</html>
