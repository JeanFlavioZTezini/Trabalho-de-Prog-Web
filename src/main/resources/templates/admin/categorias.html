<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::#pagina})}">
<head>
    <title>Categorias | Farma++</title>
</head>
<body>
<div id="pagina" class="pagina-texto">

    <nav th:replace="~{fragments/componentes :: migalhasAdmin('Categorias', null, null)}"></nav>

    <h1>Categorias</h1>

    <p class="alerta alerta--sucesso" role="status" data-toast th:if="${sucesso != null}" th:text="${sucesso}"></p>
    <p class="alerta alerta--erro" role="alert" data-toast th:if="${erro != null}" th:text="${erro}"></p>

    <p><a class="btn-primario" th:href="@{/admin/categorias/nova}">Nova categoria</a></p>
    <p>A hierarquia aceita até 2 níveis (categoria e subcategoria). Categoria inativa some do menu e dos
        filtros, junto com as suas subcategorias.</p>

    <div class="estado-vazio" th:if="${#lists.isEmpty(linhas)}">
        <p>Nenhuma categoria cadastrada.</p>
    </div>

    <div class="tabela-rolavel" role="region" aria-label="Lista de categorias" tabindex="0" th:unless="${#lists.isEmpty(linhas)}">
    <table class="tabela-admin">
        <thead>
            <tr>
                <th scope="col">Nome</th>
                <th scope="col">Ordem</th>
                <th scope="col">Status</th>
                <th scope="col">Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="c : ${linhas}">
                <td th:class="|nivel nivel-${c.nivel}|" th:text="${c.nome}">Nome</td>
                <td class="num" th:text="${c.ordem}">0</td>
                <td>
                    <span class="selo selo--sucesso" th:if="${c.ativa}">Ativa</span>
                    <span class="selo selo--neutro" th:unless="${c.ativa}">Inativa</span>
                </td>
                <td class="acoes-icone">
                    <a class="acao-icone" th:href="@{/admin/categorias/{id}/editar(id=${c.id})}" th:title="|Editar ${c.nome}|">
                        <svg th:replace="~{fragments/componentes :: iconeEditar}"></svg>
                        <span class="visually-hidden" th:text="|Editar ${c.nome}|">Editar</span>
                    </a>
                    <a class="acao-icone acao-icone--perigo" th:href="@{/admin/categorias/{id}/excluir(id=${c.id})}"
                       th:title="|Excluir ${c.nome}|">
                        <svg th:replace="~{fragments/componentes :: iconeExcluir}"></svg>
                        <span class="visually-hidden" th:text="|Excluir ${c.nome}|">Excluir</span>
                    </a>
                </td>
            </tr>
        </tbody>
    </table>
    </div>


    <script th:src="@{/js/toast.js}" defer></script>
</div>
</body>
</html>
