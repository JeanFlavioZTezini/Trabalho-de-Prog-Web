<!--/* Componentes de tela reaproveitados (guia em docs/acessibilidade.md). */-->

<!--/* Etapas da compra: atual = 1 (Carrinho) a 4 (Pedido). As anteriores ficam marcadas como feitas. */-->
<ol class="etapas" aria-label="Etapas da compra" th:fragment="etapas(atual)" xmlns:th="http://www.thymeleaf.org">
    <li th:each="rotulo, estado : ${ {'Carrinho', 'Entrega e pagamento', 'Resumo', 'Pedido'} }"
        th:classappend="${estado.count < atual} ? 'etapas__feita'"
        th:attr="aria-current=${estado.count == atual ? 'step' : null}">
        <span class="etapas__numero" aria-hidden="true" th:text="${estado.count}">1</span>
        <span class="etapas__rotulo" th:text="${rotulo}">Carrinho</span>
        <span class="visually-hidden" th:if="${estado.count < atual}">(concluída)</span>
    </li>
</ol>

<!--/* Situação do pedido em selo; o tom vem de .selo--status-<STATUS> no style.css. */-->
<span class="selo" th:fragment="situacao(status)" xmlns:th="http://www.thymeleaf.org"
      th:classappend="|selo--status-${status.name()}|" th:text="${status.rotulo}">Aguardando pagamento</span>

<!--/* Topo das telas do admin: botão Voltar (só a partir de 768 px; no celular o voltar é o do aparelho) e migalhas
       Painel › secao (atual = null) ou Painel › secao (link) › atual. O Voltar leva ao nível de cima, não ao histórico. */-->
<div class="topo-admin" th:fragment="migalhasAdmin(secao, secaoUrl, atual)" xmlns:th="http://www.thymeleaf.org">
    <a class="topo-admin__voltar" th:href="${atual == null} ? @{/admin} : @{${secaoUrl}}">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
            <path d="M15.4 7.4 14 6l-6 6 6 6 1.4-1.4L10.8 12z" fill="currentColor"/>
        </svg>
        Voltar<span class="visually-hidden" th:text="${atual == null} ? ' para o Painel' : | para ${secao}|"> para o Painel</span>
    </a>
    <nav class="migalhas" aria-label="Você está em">
        <ol>
            <li><a th:href="@{/admin}">Painel</a></li>
            <li th:if="${atual == null}" aria-current="page" th:text="${secao}">Produtos</li>
            <li th:if="${atual != null}"><a th:href="@{${secaoUrl}}" th:text="${secao}">Produtos</a></li>
            <li th:if="${atual != null}" aria-current="page" th:text="${atual}">Editar</li>
        </ol>
    </nav>
</div>

<!--/* Ícones das ações por linha (.acao-icone). Sempre com o nome da ação em .visually-hidden e no title. */-->
<svg th:fragment="iconeEditar" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false" xmlns:th="http://www.thymeleaf.org">
    <path d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75L3 17.25zm17.7-10.2a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" fill="currentColor"/>
</svg>
<svg th:fragment="iconeExcluir" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false" xmlns:th="http://www.thymeleaf.org">
    <path d="M9 3h6l1 2h4v2H4V5h4l1-2zm-3 6h12l-1 12H7L6 9zm4 2v8h2v-8h-2zm4 0v8h2v-8h-2z" fill="currentColor"/>
</svg>
<svg th:fragment="iconeVer" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false" xmlns:th="http://www.thymeleaf.org">
    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z" fill="currentColor"/>
</svg>

<!--/* Situação da conta do cliente (admin): ativa = sucesso, pendente = aviso, excluída = neutro. */-->
<span class="selo" th:fragment="situacaoConta(status, rotulo)" xmlns:th="http://www.thymeleaf.org"
      th:classappend="${status.name() == 'ATIVA'} ? 'selo--sucesso' : (${status.name() == 'PENDENTE'} ? 'selo--aviso' : 'selo--neutro')"
      th:text="${rotulo}">Ativa</span>
