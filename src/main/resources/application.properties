spring.application.name=farmacia-online
spring.datasource.url=jdbc:postgresql://localhost:5433/farmacia
spring.datasource.username=farmacia
spring.datasource.password=farmacia

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.show-sql=false
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# As telas leem coleções LAZY (apresentações, imagens) durante a renderização: ver docs/desenvolvimento.md, "Modelo de dados".
spring.jpa.open-in-view=true

# A página só é enviada ao navegador depois de pronta; senão o token CSRF do /login não consegue criar a sessão (ver docs/desenvolvimento.md, "Segurança").
spring.thymeleaf.servlet.produce-partial-output-while-processing=false

# Fotos de produto (UC12): pasta fora do JAR; o limite de 2 MB por foto é validado no ArmazenamentoImagem.
app.uploads.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
# Cada campo de um multipart conta como parte, e o formulário de produto passa de 50 (o padrão) só com as apresentações.
server.tomcat.max-part-count=120

# CSS, JS e imagens do site: o navegador guarda e só confere se mudou (304), em vez do "no-store" que o Spring Security
# põe em tudo. "no-cache" (e não um max-age) para ninguém ficar com um CSS velho depois de uma alteração.
spring.web.resources.cache.cachecontrol.no-cache=true

# Versão dos termos de uso que o cadastro grava junto com a data do aceite (LGPD). Suba o número quando os termos mudarem.
app.termos.versao=1.0

# Perfil demo: liga a caixa de mensagens de teste em /caixa-demo, onde aparecem os códigos que o envio simulado de
# e-mail e SMS "mandou". Para desligar, apague esta linha (ou suba com outro perfil: SPRING_PROFILES_ACTIVE=producao).
spring.profiles.active=demo

# Códigos de verificação (F-05): validade, tentativas por código, espera entre envios e limite de envios. Depois de
# app.codigos.envios-por-hora envios em 1 hora, cada novo envio só sai app.codigos.bloqueio-envio depois do anterior.
app.codigos.validade=10m
app.codigos.tentativas-maximas=5
app.codigos.intervalo-reenvio=60s
app.codigos.envios-por-hora=5
app.codigos.bloqueio-envio=15m

# Checkout (F-14): por quanto tempo um pedido segura o estoque antes de ter Pix ou boleto gerado (cartão recusado,
# resposta perdida) e de quanto em quanto as reservas vencidas são liberadas. Use "-" no cron para desligar.
app.checkout.validade-reserva=30m
app.checkout.expiracao.cron=0 * * * * *

# Consulta de CEP do formulário de endereço: "viacep" (API pública, precisa de internet) ou "demo" (CEPs fixos, offline).
# Se o ViaCEP demorar ou cair, a tela avisa e a pessoa preenche à mão.
app.cep.provedor=viacep
app.cep.viacep.url=https://viacep.com.br/ws
spring.http.client.connect-timeout=3s
spring.http.client.read-timeout=4s

# F-18: encerra sessões inativas após 30 minutos.
server.servlet.session.timeout=30m
