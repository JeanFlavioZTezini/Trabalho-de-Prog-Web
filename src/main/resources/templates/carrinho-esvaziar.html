<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::#pagina})}">
<head>
    <title>Esvaziar carrinho | Farma++</title>
</head>
<body>
<div id="pagina" class="pagina-texto pagina-texto--estreita">

    <h1>Esvaziar o carrinho?</h1>

    <p>
        Você vai tirar todos os itens do carrinho
        (<span th:text="${resumo.totalUnidades}">3</span> un.). Depois, é preciso adicioná-los de novo.
    </p>

    <form class="acoes" th:action="@{/carrinho/esvaziar}" method="post">
        <button type="submit" class="btn-perigo">Sim, esvaziar</button>
        <a class="btn-secundario" th:href="@{/carrinho}">Não, voltar ao carrinho</a>
    </form>

</div>
</body>
</html>
