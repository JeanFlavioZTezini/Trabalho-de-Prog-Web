<article class="card" th:fragment="card(produto)" xmlns:th="http://www.thymeleaf.org">
    <a class="card-link" th:href="@{/produtos/{id}(id=${produto.id})}">
        <div class="imagem">
            <img th:src="@{${produto.urlCapa}}" th:alt="${produto.nome}">
        </div>
        <p class="nome" th:text="${produto.nome}">Nome do produto</p>
        <th:block th:with="apresentacao=${produto.apresentacaoReferenciaAtiva}">
            <p class="qtd" th:if="${apresentacao != null}"
               th:text="${apresentacao.descricao}">Apresentação</p>
            <p class="qtd" th:unless="${apresentacao != null}">Sem apresentação ativa</p>
            <div class="selos">
                <span class="selo selo--indisponivel" th:if="${produto.indisponivel}">Indisponível</span>
                <span class="selo selo--receita" th:if="${produto.exigeReceita}">Exige receita</span>
            </div>
            <div class="card-rodape">
                <span class="preco" th:if="${apresentacao != null}"
                      th:text="${#numbers.formatCurrency(apresentacao.preco)}">R$ 0,00</span>
                <span class="preco" th:unless="${apresentacao != null}">Preço indisponível</span>
            </div>
        </th:block>
    </a>
</article>
