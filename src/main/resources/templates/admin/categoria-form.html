<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::#pagina})}">
<head>
    <title>Categoria | Farma++</title>
</head>
<body>
<div id="pagina" class="pagina-texto pagina-texto--estreita">

    <nav th:replace="~{fragments/componentes :: migalhasAdmin('Categorias', '/admin/categorias', ${categoriaId == null ? 'Nova' : 'Editar'})}"></nav>

    <h1 th:text="${categoriaId == null} ? 'Nova categoria' : 'Editar categoria'">Categoria</h1>

    <p class="alerta alerta--erro" role="alert" th:if="${erro != null}" th:text="${erro}"></p>

    <form th:action="${categoriaId == null} ? @{/admin/categorias} : @{/admin/categorias/{id}(id=${categoriaId})}"
          th:object="${categoriaForm}" method="post">
        <input type="hidden" th:field="*{versao}">

        <div class="campo">
            <label for="nome">Nome</label>
            <input type="text" id="nome" th:field="*{nome}" maxlength="80" required
                   th:aria-invalid="${#fields.hasErrors('nome')} ? 'true'"
                   th:aria-describedby="${#fields.hasErrors('nome')} ? 'nome-erro'">
            <p class="campo__erro" role="alert" id="nome-erro" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></p>
        </div>

        <div class="campo">
            <label for="descricao">Descrição</label>
            <textarea id="descricao" th:field="*{descricao}" rows="3"></textarea>
        </div>

        <div class="campo">
            <label for="paiId">Categoria pai</label>
            <select id="paiId" th:field="*{paiId}" th:aria-invalid="${#fields.hasErrors('paiId')} ? 'true'"
                    th:aria-describedby="${#fields.hasErrors('paiId')} ? 'paiId-ajuda paiId-erro' : 'paiId-ajuda'">
                <option value="">(nenhuma - categoria raiz)</option>
                <option th:each="o : ${opcoesPai}" th:value="${o.id}"
                        th:text="${o.nome + (o.ativa ? '' : ' (inativa)')}">Pai</option>
            </select>
            <p class="campo__ajuda" id="paiId-ajuda">Limite de 2 níveis: só categorias raiz podem ser pai.</p>
            <p class="campo__erro" role="alert" id="paiId-erro" th:if="${#fields.hasErrors('paiId')}" th:errors="*{paiId}"></p>
        </div>

        <div class="campo">
            <label for="ordem">Ordem</label>
            <input type="number" id="ordem" th:field="*{ordem}" min="0"
                   th:aria-invalid="${#fields.hasErrors('ordem')} ? 'true'"
                   th:aria-describedby="${#fields.hasErrors('ordem')} ? 'ordem-erro'">
            <p class="campo__erro" role="alert" id="ordem-erro" th:if="${#fields.hasErrors('ordem')}" th:errors="*{ordem}"></p>
        </div>

        <div class="campo">
            <label class="campo__marcador"><input type="checkbox" th:field="*{ativa}"> Ativa</label>
        </div>

        <div class="acoes">
            <button type="submit" class="btn-primario">Salvar</button>
            <a class="btn-secundario" th:href="@{/admin/categorias}">Cancelar</a>
        </div>
    </form>

</div>
</body>
</html>
