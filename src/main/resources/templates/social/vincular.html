<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::#pagina})}">
<head>
    <title>Vincular conta | Farma++</title>
</head>
<body>
<div id="pagina" class="pagina-texto pagina-texto--estreita">

    <h1>Este CPF já tem conta</h1>

    <p class="alerta alerta--sucesso" role="status" th:if="${sucesso != null}" th:text="${sucesso}"></p>
    <p class="alerta alerta--erro" role="alert" th:if="${erro != null}" th:text="${erro}"></p>

    <p>Para ligar o <span th:text="${nomeProvedor}">Google (simulado)</span> a essa conta, comprove que ela é sua. Só ter o
        mesmo e-mail não basta.</p>

    <section aria-labelledby="titulo-senha">
        <h2 id="titulo-senha">Com a senha da conta</h2>
        <form th:action="@{/login/social/vincular/senha}" method="post">
            <div th:replace="~{fragments/campo :: campo(id='senha', nome='senha', rotulo='Senha', tipo='password', ajuda=null, erro=null, autocomplete='current-password')}"></div>
            <button type="submit" class="btn-primario btn-primario--bloco">Vincular com a senha</button>
        </form>
    </section>

    <section aria-labelledby="titulo-codigo">
        <h2 id="titulo-codigo">Com um código no e-mail da conta</h2>
        <p>O código vai para <strong th:text="${emailMascarado}">m***@exemplo.com</strong>, o e-mail cadastrado na conta.</p>
        <form th:action="@{/login/social/vincular/codigo}" method="post">
            <div th:replace="~{fragments/campo :: campo(id='codigo', nome='codigo', rotulo='Código recebido', tipo='text', ajuda=null, erro=null, autocomplete='one-time-code')}"></div>
            <button type="submit" class="btn-primario btn-primario--bloco">Vincular com o código</button>
        </form>
        <form th:action="@{/login/social/vincular/codigo/enviar}" method="post">
            <button type="submit" class="btn-secundario">Enviar código</button>
        </form>
    </section>

    <p class="pagina-texto__rodape-form"><a th:href="@{/login}">Cancelar e voltar para o login</a></p>
</div>
</body>
</html>
