<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::#pagina})}">
<head>
    <title>Código de recuperação | Farma++</title>
</head>
<body>
<div id="pagina" class="pagina-texto pagina-texto--estreita">

    <h1>Digite o código</h1>

    <p class="alerta alerta--sucesso" role="status" th:if="${sucesso}" th:text="${sucesso}">Enviamos um código.</p>
    <p class="alerta alerta--erro" role="alert" th:if="${erro}" th:text="${erro}">Erro.</p>

    <form th:action="@{/recuperar-senha/codigo}" method="post">
        <div class="campo">
            <label for="codigo">Código de 6 números</label>
            <p class="campo__ajuda" id="codigo-ajuda"
               th:text="|Vale por ${validadeMinutos} minutos. Pedir outro código invalida o anterior.|">Vale por 10 minutos.</p>
            <input type="text" id="codigo" name="codigo" inputmode="numeric" autocomplete="one-time-code"
                   maxlength="6" pattern="[0-9]{6}" required aria-describedby="codigo-ajuda">
        </div>
        <button type="submit" class="btn-primario btn-primario--bloco">Continuar</button>
    </form>

    <p class="pagina-texto__rodape-form"><a th:href="@{/recuperar-senha}">Pedir outro código</a></p>

</div>
</body>
</html>
