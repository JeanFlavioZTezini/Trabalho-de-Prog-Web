<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::#pagina})}">
<head>
    <title>Produtos | Farma++</title>
</head>
<body>
<div id="pagina" class="pagina-texto">

    <nav th:replace="~{fragments/componentes :: migalhasAdmin('Produtos', null, null)}"></nav>

    <h1>Produtos</h1>

    <p class="alerta alerta--sucesso" role="status" th:if="${sucesso != null}" th:text="${sucesso}"></p>

    <p class="alerta alerta--erro" role="alert" th:if="${erro != null}" th:text="${erro}"></p>

    <p><a class="btn-primario" th:href="@{/admin/produtos/novo}">Novo produto</a></p>

    <form class="filtros" th:action="@{/admin/produtos}" method="get">
        <div class="campo">
            <label for="q">Buscar por nome, marca, princípio ativo, SKU ou EAN</label>
            <span class="campo-busca"><svg th:replace="~{fragments/componentes :: iconeBusca}"></svg><input type="search" id="q" name="q" th:value="${q}"></span>
        </div>
        <div class="campo">
            <label for="status">Status</label>
            <select id="status" name="status">
                <option value="">Todos</option>
                <option value="ativos" th:selected="${status == 'ativos'}">Ativos</option>
                <option value="inativos" th:selected="${status == 'inativos'}">Inativos</option>
            </select>
        </div>
        <div class="filtros__acoes">
            <button type="submit" class="btn-primario">Filtrar</button>
            <a class="btn-secundario" th:href="@{/admin/produtos}">Limpar filtros</a>
        </div>
    </form>

    <div class="estado-vazio" th:if="${pagina.empty}">
        <p>Nenhum produto encontrado.</p>
    </div>

    <div class="tabela-rolavel" role="region" aria-label="Lista de produtos" tabindex="0" th:unless="${pagina.empty}">
        <table class="tabela-admin">
            <thead>
                <tr>
                    <th scope="col">Nome</th>
                    <th scope="col">Marca</th>
                    <th scope="col">Tarja</th>
                    <th scope="col">Apresentações</th>
                    <th scope="col">Status</th>
                    <th scope="col">Ações</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${pagina.content}">
                    <td th:text="${p.nome}">Nome</td>
                    <td th:text="${p.marca}">Marca</td>
                    <td th:text="${p.tarja}">SEM_TARJA</td>
                    <td class="num" th:text="${#lists.size(p.apresentacoes)}">0</td>
                    <td>
                        <span class="selo selo--sucesso" th:if="${p.ativo}">Ativo</span>
                        <span class="selo selo--neutro" th:unless="${p.ativo}">Inativo</span>
                    </td>
                    <td class="acoes-icone">
                        <a class="acao-icone" th:href="@{/admin/produtos/{id}/editar(id=${p.id})}"
                           th:title="|Editar ${p.nome}|">
                            <svg th:replace="~{fragments/componentes :: iconeEditar}"></svg>
                            <span class="visually-hidden" th:text="|Editar ${p.nome}|">Editar</span>
                        </a>
                        <form th:action="@{/admin/produtos/{id}/excluir(id=${p.id})}" method="post"
                              onsubmit="return confirm('Excluir este produto? Se houver pedidos, ele será apenas inativado.')">
                            <button type="submit" class="acao-icone acao-icone--perigo" th:title="|Excluir ${p.nome}|">
                                <svg th:replace="~{fragments/componentes :: iconeExcluir}"></svg>
                                <span class="visually-hidden" th:text="|Excluir ${p.nome}|">Excluir</span>
                            </button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <nav class="paginacao" aria-label="Paginação de produtos" th:if="${pagina.totalPages > 1}">
        <a th:if="${pagina.hasPrevious()}"
           th:href="@{/admin/produtos(q=${q}, status=${status}, pagina=${pagina.number - 1})}">Anterior</a>
        <span th:text="|Página ${pagina.number + 1} de ${pagina.totalPages}|">Página 1 de 1</span>
        <a th:if="${pagina.hasNext()}"
           th:href="@{/admin/produtos(q=${q}, status=${status}, pagina=${pagina.number + 1})}">Próxima</a>
    </nav>

</div>
</body>
</html>
