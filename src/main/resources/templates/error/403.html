<!DOCTYPE html>
<!--
    Página de erro 403 (acesso negado). O Spring Boot usa este arquivo sozinho para o status 403:
    cliente tentando abrir /admin, ou formulário enviado sem o token CSRF.
-->
<html th:replace="~{fragments/layout :: layout(~{::title}, ~{::#pagina})}">
<head>
    <title>Acesso negado | Farma++</title>
</head>
<body>
<div id="pagina" class="pagina-texto">

    <h1>Acesso negado</h1>
    <div class="estado-vazio">
        <p>Você não tem permissão para acessar esta página.</p>
        <p>
            Se você estava preenchendo um formulário, a sessão pode ter expirado:
            volte, recarregue a página e envie de novo.
        </p>
        <div class="acoes">
            <a class="btn-primario" th:href="@{/}">Ir para a página inicial</a>
            <a class="btn-secundario" th:href="@{/login}" sec:authorize="isAnonymous()">Entrar</a>
        </div>
    </div>

</div>
</body>
</html>
